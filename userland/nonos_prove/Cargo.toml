# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# The proeve verifiable-compute VM. A register and memory machine over the
# Goldilocks field whose execution trace the NONOS in-kernel transparent STARK
# proves. The field and Poseidon permutation are drawn from nonos-stark, the one
# shared source, so no second definition of the field exists.

[package]
name = "nonos_prove"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
nonos-stark = { path = "../../nonos-stark" }
# nonos-stark commits with Poseidon and measures with blake3. Force blake3's
# pure-Rust path so the crate cross-compiles to the capsule target without a C
# toolchain, matching how the kernel pins it. Not called directly here; present
# only to unify the feature across the dependency graph.
blake3 = { version = "1.0", default-features = false, features = ["pure"] }
