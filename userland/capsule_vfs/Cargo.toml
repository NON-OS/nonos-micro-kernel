# NONOS userland: capsule_vfs
# eK@nonos.systems
#
# VFS authority as a userland capsule. Owns path resolution, the fd
# table, and per-fd backing routing. State is capsule-bounded;
# respawn = empty VFS by design (RAM-only profile).

[package]
name = "nonos_capsule_vfs"
version = "0.3.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "NONOS VFS capsule, userland filesystem authority"

[[bin]]
name = "vfs"
path = "src/main.rs"

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }

[features]
seed-terminal-store = []
seed-audio-store = []

[profile.release]
panic    = "abort"
opt-level = 2
lto      = false
debug    = false
strip    = true

[profile.dev]
panic    = "abort"
opt-level = 0
debug    = true
