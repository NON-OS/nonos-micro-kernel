# and verifier to prove the honest run accepts and a tampered run is rejected.

[package]
name = "nonos_prove_proofs"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
nonos_prove = { path = "../nonos_prove" }
nonos-stark = { path = "../../nonos-stark" }
