<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="400" viewBox="0 0 1180 400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1180" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2E5C5C"/>
    </marker>
  </defs>

  <text x="30" y="66" fill="#12403f" font-size="17" font-weight="700">From the shipping function to a theorem about it</text>

  <!-- 1: source -->
  <rect x="30" y="120" width="225" height="140" rx="12" fill="#ffffff" stroke="#2E5C5C" stroke-width="2.2"/>
  <rect x="30" y="120" width="225" height="8" rx="4" fill="#66FFFF"/>
  <text x="142" y="162" fill="#12403f" font-size="19" font-weight="700" text-anchor="middle">The code that ships</text>
  <text x="142" y="192" fill="#2E5C5C" font-size="14" text-anchor="middle" font-family="Menlo, Consolas, monospace">src/capabilities/</text>
  <text x="142" y="212" fill="#2E5C5C" font-size="14" text-anchor="middle" font-family="Menlo, Consolas, monospace">bits.rs</text>
  <text x="142" y="240" fill="#5E7E7E" font-size="12.5" text-anchor="middle">included, never copied</text>

  <!-- 2: llbc -->
  <rect x="345" y="120" width="225" height="140" rx="12" fill="#ffffff" stroke="#2E5C5C" stroke-width="2.2"/>
  <rect x="345" y="120" width="225" height="8" rx="4" fill="#66FFFF"/>
  <text x="457" y="162" fill="#12403f" font-size="19" font-weight="700" text-anchor="middle">Borrow&#8211;checked IR</text>
  <text x="457" y="192" fill="#2E5C5C" font-size="14" text-anchor="middle" font-family="Menlo, Consolas, monospace">caps.llbc</text>
  <text x="457" y="222" fill="#5E7E7E" font-size="12.5" text-anchor="middle">the exact MIR of</text>
  <text x="457" y="240" fill="#5E7E7E" font-size="12.5" text-anchor="middle">that function</text>

  <!-- 3: lean defs -->
  <rect x="660" y="120" width="225" height="140" rx="12" fill="#ffffff" stroke="#2E5C5C" stroke-width="2.2"/>
  <rect x="660" y="120" width="225" height="8" rx="4" fill="#66FFFF"/>
  <text x="772" y="162" fill="#12403f" font-size="19" font-weight="700" text-anchor="middle">Lean definitions</text>
  <text x="772" y="192" fill="#2E5C5C" font-size="14" text-anchor="middle" font-family="Menlo, Consolas, monospace">Caps.lean</text>
  <text x="772" y="222" fill="#5E7E7E" font-size="12.5" text-anchor="middle">generated, never</text>
  <text x="772" y="240" fill="#5E7E7E" font-size="12.5" text-anchor="middle">hand&#8211;edited</text>

  <!-- 4: theorems -->
  <rect x="975" y="120" width="175" height="140" rx="12" fill="#E8FBFB" stroke="#2E5C5C" stroke-width="2.5"/>
  <rect x="975" y="120" width="175" height="8" rx="4" fill="#2E5C5C"/>
  <text x="1062" y="164" fill="#12403f" font-size="18" font-weight="700" text-anchor="middle">Security</text>
  <text x="1062" y="186" fill="#12403f" font-size="18" font-weight="700" text-anchor="middle">theorems</text>
  <text x="1062" y="216" fill="#2E5C5C" font-size="12.5" text-anchor="middle">hold of the</text>
  <text x="1062" y="234" fill="#2E5C5C" font-size="12.5" text-anchor="middle">extracted defs</text>

  <!-- arrows + tool labels -->
  <line x1="258" y1="190" x2="342" y2="190" stroke="#2E5C5C" stroke-width="2.2" marker-end="url(#a2)"/>
  <text x="300" y="176" fill="#2E5C5C" font-size="13.5" font-weight="700" text-anchor="middle">Charon</text>
  <text x="300" y="211" fill="#5E7E7E" font-size="11.5" text-anchor="middle">rustc MIR</text>

  <line x1="573" y1="190" x2="657" y2="190" stroke="#2E5C5C" stroke-width="2.2" marker-end="url(#a2)"/>
  <text x="615" y="176" fill="#2E5C5C" font-size="13.5" font-weight="700" text-anchor="middle">Aeneas</text>
  <text x="615" y="211" fill="#5E7E7E" font-size="11.5" text-anchor="middle">Lean backend</text>

  <line x1="888" y1="190" x2="972" y2="190" stroke="#2E5C5C" stroke-width="2.2" marker-end="url(#a2)"/>
  <text x="930" y="176" fill="#2E5C5C" font-size="12.5" font-weight="700" text-anchor="middle">Refinement</text>
  <text x="930" y="211" fill="#5E7E7E" font-size="11.5" text-anchor="middle">.lean</text>

  <!-- footer note -->
  <rect x="30" y="312" width="1120" height="50" rx="10" fill="#F2F7F7" stroke="#9DB8B8" stroke-width="1.4"/>
  <text x="590" y="343" fill="#2E5C5C" font-size="15" text-anchor="middle">Regeneration from an unchanged kernel is byte&#8211;stable: any change to the shipping function surfaces as a diff in the extracted Lean.</text>
</svg>
